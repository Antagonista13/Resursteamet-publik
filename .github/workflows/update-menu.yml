name: Uppdatera offentlig matsedel
on:
  schedule:
    - cron: "25 5 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-menu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Hämta Gånghesterskolans offentliga matsedel
        run: python scripts/update_menu.py
      - name: Spara uppdateringen
        run: |
          if ! git diff --quiet -- menu.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add menu.json
            git commit -m "Uppdatera offentlig matsedel"
            git push
          fi
